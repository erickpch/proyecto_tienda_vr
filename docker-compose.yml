services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tiendavr}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tiendavr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend-nest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tiendavr}

      JWT_SECRET: ${JWT_SECRET:?falta definir JWT_SECRET en el .env}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}

      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_CORREO: ${ADMIN_CORREO:-admin@tienda.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}

      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}

      # Seeder: SEED_DEMO=false deja solo roles y admin;
      # SEED_FORZAR=true vuelve a sembrar aunque ya existan productos.
      SEED_DIR: /app/seed
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_FORZAR: ${SEED_FORZAR:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-demo1234}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_MONEDA: ${STRIPE_MONEDA:-usd}
      STRIPE_TASA_BOB: ${STRIPE_TASA_BOB:-6.96}
      STRIPE_MINIMO_CENTAVOS: ${STRIPE_MINIMO_CENTAVOS:-50}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      IA_HABILITADA: ${IA_HABILITADA:-true}
      IA_CONSULTAS_POR_HORA: ${IA_CONSULTAS_POR_HORA:-30}

      RESERVA_HORAS_VIGENCIA: ${RESERVA_HORAS_VIGENCIA:-24}
    volumes:
      - imagenes:/app/uploads
    ports:
      - "${API_PORT:-3000}:3000"

  web:
    build:
      context: ./front-react
      args:
        # Ruta relativa: nginx (servicio `web`) hace de proxy hacia `api`, asi
        # el navegador solo necesita el puerto del frontend.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # Consola web para mirar la base. Solo herramienta de desarrollo: no la
  # publiques fuera de tu maquina, entra sin login y llega directo al Postgres.
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tienda.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      # Modo escritorio: entra solo, sin pantalla de login ni master password.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - datos_pgadmin:/var/lib/pgadmin
      # Deja la conexion al servicio `db` ya cargada en el arbol.
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    ports:
      - "${PGADMIN_PORT:-5050}:80"

volumes:
  datos_postgres:
  datos_pgadmin:
  imagenes:
